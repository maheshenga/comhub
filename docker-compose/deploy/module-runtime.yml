services:
  module-app-postgres:
    image: paradedb/paradedb@sha256:f7061b0311ecffcbe33c673f632431cfc1f4e908a52461f525a677589dc37393
    environment:
      POSTGRES_DB: module_app_test
      POSTGRES_PASSWORD: module_app_test
      POSTGRES_USER: module_app_test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U module_app_test -d module_app_test']
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - module-app-worker-internal
      - module-app-seed
    ports:
      - '${MODULE_APP_TEST_POSTGRES_PORT:-55432}:5432'
    tmpfs:
      - /var/lib/postgresql/data

  module-app-redis:
    image: redis:7.4.5-alpine3.21
    command: ['redis-server', '--appendonly', 'no', '--save', '']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - '${MODULE_APP_TEST_REDIS_PORT:-56379}:6379'
    tmpfs:
      - /data

  module-app-s3:
    image: rustfs/rustfs@sha256:fa19210ac4697c79d7ccca1ec9b0eb91aebacc6691991ffb14014bb3c67e6cc3
    command:
      [
        '--access-key',
        'module_app_worker_test',
        '--secret-key',
        'module_app_worker_test_secret',
        '/data',
      ]
    environment:
      RUSTFS_ACCESS_KEY: module_app_worker_test
      RUSTFS_CONSOLE_ENABLE: 'false'
      RUSTFS_SECRET_KEY: module_app_worker_test_secret
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9000/health >/dev/null 2>&1']
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - module-app-worker-internal
      - module-app-seed
    ports:
      - '${MODULE_APP_TEST_S3_PORT:-59000}:9000'
    tmpfs:
      - /data:uid=10001,gid=10001,mode=0770

  module-app-s3-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        mc alias set module-app-s3 http://module-app-s3:9000 module_app_worker_test module_app_worker_test_secret
        mc mb module-app-s3/module-app-worker-test --ignore-existing
    depends_on:
      module-app-s3:
        condition: service_healthy
    networks:
      - module-app-worker-internal

  module-app-artifact-init:
    image: node:22.22.0-alpine3.23
    command:
      - sh
      - -ec
      - |
        mkdir -p /runtime/artifacts
        printf 'module-runtime-artifact-mount' > /runtime/artifacts/.verification-marker
        chown -R 10001:10001 /runtime/artifacts
        chmod 0444 /runtime/artifacts/.verification-marker
    network_mode: none
    user: '0:0'
    volumes:
      - module-app-artifacts:/runtime/artifacts:rw

  module-app-worker:
    build:
      context: ../..
      dockerfile: apps/module-worker/Dockerfile
    image: '${COMHUB_MODULE_WORKER_IMAGE:-comhub-module-worker:test}'
    cap_drop:
      - ALL
    depends_on:
      module-app-postgres:
        condition: service_healthy
      module-app-s3:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://module_app_test:module_app_test@module-app-postgres:5432/module_app_test
      MODULE_APP_ALIPAY_AUTO_SETTLEMENT_ENABLED: 'false'
      MODULE_APP_ALIPAY_PAYMENT_CREATION_ENABLED: 'false'
      MODULE_APP_ARTIFACT_ROOT: /runtime/artifacts
      MODULE_APP_EXECUTION_ENABLED: 'false'
      MODULE_APP_PUBLISHER_PAYOUT_RECORDING_ENABLED: 'false'
      MODULE_APP_PUBLIC_EXECUTION_ENABLED: 'false'
      MODULE_APP_RUNTIME_INVOCATION_ENABLED: 'false'
      MODULE_APP_SCHEDULE_DISPATCH_ENABLED: 'false'
      MODULE_APP_WORKFLOW_PRIVILEGED_EXECUTORS_ENABLED: 'false'
      S3_ACCESS_KEY_ID: module_app_worker_test
      S3_BUCKET: module-app-worker-test
      S3_ENABLE_PATH_STYLE: 'true'
      S3_ENDPOINT: http://module-app-s3:9000
      S3_SECRET_ACCESS_KEY: module_app_worker_test_secret
    healthcheck:
      test: ['CMD', 'node', '/app/worker.mjs', 'healthcheck']
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 20
    networks:
      - module-app-worker-internal
    privileged: false
    profiles: ['worker']
    read_only: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    user: '10001:10001'
    volumes:
      - module-app-artifacts:/runtime/artifacts:rw

  module-runtime:
    build:
      context: ../..
      dockerfile: apps/module-runtime/Dockerfile
    image: '${COMHUB_MODULE_RUNTIME_IMAGE:-comhub-module-runtime:local}'
    cap_drop:
      - ALL
    environment:
      MODULE_APP_ALIPAY_AUTO_SETTLEMENT_ENABLED: 'false'
      MODULE_APP_ALIPAY_PAYMENT_CREATION_ENABLED: 'false'
      MODULE_APP_EXECUTION_ENABLED: '${MODULE_APP_EXECUTION_ENABLED:-false}'
      MODULE_APP_PUBLISHER_PAYOUT_RECORDING_ENABLED: 'false'
      MODULE_APP_PUBLIC_EXECUTION_ENABLED: 'false'
      MODULE_APP_RUNTIME_DOCKER_ARTIFACT_ROOT: /runtime/artifacts
      MODULE_APP_RUNTIME_INTERNAL_TOKEN: '${MODULE_APP_RUNTIME_INTERNAL_TOKEN:-}'
      MODULE_APP_RUNTIME_INVOCATION_ENABLED: '${MODULE_APP_RUNTIME_INVOCATION_ENABLED:-false}'
      MODULE_APP_RUNTIME_JWKS: '${MODULE_APP_RUNTIME_JWKS:-}'
      MODULE_APP_RUNTIME_NODE22_IMAGE: '${MODULE_APP_RUNTIME_NODE22_IMAGE:-}'
      MODULE_APP_RUNTIME_PYTHON312_IMAGE: '${MODULE_APP_RUNTIME_PYTHON312_IMAGE:-}'
      MODULE_APP_SCHEDULE_DISPATCH_ENABLED: 'false'
      MODULE_APP_WORKFLOW_PRIVILEGED_EXECUTORS_ENABLED: 'false'
    group_add:
      - '${MODULE_APP_DOCKER_GID:-0}'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "require(''http'').get(''http://127.0.0.1:3210/health'',r=>process.exit(r.statusCode===200?0:1)).on(''error'',()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles: ['runtime']
    ports:
      - '${MODULE_APP_TEST_RUNTIME_PORT:-53210}:3210'
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    user: '10001:10001'
    volumes:
      - module-app-artifacts:/runtime/artifacts:ro
      - /var/run/docker.sock:/var/run/docker.sock

  module-app-main-probe:
    image: node:22.22.0-alpine3.23
    command:
      - node
      - -e
      - |
        const flags = [
          'MODULE_APP_EXECUTION_ENABLED',
          'MODULE_APP_RUNTIME_INVOCATION_ENABLED',
          'MODULE_APP_WORKFLOW_PRIVILEGED_EXECUTORS_ENABLED',
          'MODULE_APP_SCHEDULE_DISPATCH_ENABLED',
          'MODULE_APP_ALIPAY_PAYMENT_CREATION_ENABLED',
          'MODULE_APP_ALIPAY_AUTO_SETTLEMENT_ENABLED',
          'MODULE_APP_PUBLISHER_PAYOUT_RECORDING_ENABLED',
          'MODULE_APP_PUBLIC_EXECUTION_ENABLED',
        ];
        if (flags.some((flag) => process.env[flag] === 'true')) process.exit(1);
        process.stdout.write('MODULE_APP_MUTATION_FLAGS_DISABLED\n');
    environment:
      MODULE_APP_ALIPAY_AUTO_SETTLEMENT_ENABLED: 'false'
      MODULE_APP_ALIPAY_PAYMENT_CREATION_ENABLED: 'false'
      MODULE_APP_EXECUTION_ENABLED: 'false'
      MODULE_APP_PUBLISHER_PAYOUT_RECORDING_ENABLED: 'false'
      MODULE_APP_PUBLIC_EXECUTION_ENABLED: 'false'
      MODULE_APP_RUNTIME_INVOCATION_ENABLED: 'false'
      MODULE_APP_SCHEDULE_DISPATCH_ENABLED: 'false'
      MODULE_APP_WORKFLOW_PRIVILEGED_EXECUTORS_ENABLED: 'false'
    profiles: ['probe']

volumes:
  module-app-artifacts:
    name: '${MODULE_APP_TEST_ARTIFACT_VOLUME:-comhub-module-app-verification-artifacts}'

networks:
  module-app-seed:
  module-app-worker-internal:
    internal: true
