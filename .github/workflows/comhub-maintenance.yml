name: ComHub Server Maintenance
run-name: ComHub Server Maintenance (action=${{ inputs.action }})

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Read-only reports or bounded safe cleanup'
        required: true
        default: report
        type: choice
        options:
          - report
          - report-deep
          - cleanup-safe

permissions:
  contents: read

jobs:
  maintenance:
    name: Server Disk Maintenance
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: comhub-production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout maintenance tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate maintenance request
        shell: bash
        env:
          MAINTENANCE_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" = 'refs/heads/main' ]] || {
            echo 'production maintenance must be dispatched from main' >&2
            exit 1
          }
          case "$MAINTENANCE_ACTION" in
            report|report-deep|cleanup-safe) ;;
            *)
              echo 'unsupported maintenance action' >&2
              exit 1
              ;;
          esac

      - name: Install SSH key
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.COMHUB_SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.COMHUB_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          grep -q '[^[:space:]]' <<< "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/comhub_maintenance_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/comhub_maintenance_key
          chmod 600 ~/.ssh/known_hosts

      - name: Run bounded server maintenance
        shell: bash
        env:
          MAINTENANCE_ACTION: ${{ inputs.action }}
          SSH_HOST: ${{ secrets.COMHUB_SSH_HOST }}
          SSH_PORT: ${{ secrets.COMHUB_SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.COMHUB_SSH_USER || 'root' }}
        run: |
          set -euo pipefail

          case "$MAINTENANCE_ACTION" in
            report|report-deep|cleanup-safe) ;;
            *)
              echo 'unsupported maintenance action' >&2
              exit 1
              ;;
          esac

          ssh_options=(
            -i "$HOME/.ssh/comhub_maintenance_key"
            -p "$SSH_PORT"
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$HOME/.ssh/known_hosts"
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=4
            -o ConnectTimeout=30
          )

          # The action is restricted to the fixed choice list above.
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$MAINTENANCE_ACTION'" <<'REMOTE_MAINTENANCE'
          set -Eeuo pipefail
          export LC_ALL=C

          action="$1"
          case "$action" in
            report|report-deep|cleanup-safe) ;;
            *)
              echo 'unsupported remote maintenance action' >&2
              exit 1
              ;;
          esac

          report_disk() {
            local target
            local -a largest_file_roots=()

            echo '== Root filesystem =='
            df -hT /
            df -i /

            echo '== Docker summary =='
            docker system df || true
            docker ps -a --size \
              --format 'table {{.Names}}\t{{.Status}}\t{{.Size}}' || true

            echo '== System journal =='
            if command -v journalctl >/dev/null 2>&1; then
              journalctl --disk-usage || true
            else
              echo 'journalctl unavailable'
            fi

            echo '== Selected directory totals (bytes) =='
            {
              for target in \
                /var/lib/docker \
                /var/log \
                /var/cache \
                /www \
                /www/compose/comhub \
                /www/wwwlogs \
                /tmp; do
                if [ -e "$target" ]; then
                  du -x -s -B1 -- "$target" 2>/dev/null || true
                fi
              done
            } | sort -nr | head -20 || true

            for target in /www/compose/comhub /www/wwwlogs /var/log; do
              [ ! -d "$target" ] || largest_file_roots+=("$target")
            done
            echo '== Largest selected files (bytes, top 30) =='
            if [ "${#largest_file_roots[@]}" -eq 0 ]; then
              echo 'no selected file roots available'
            else
              find "${largest_file_roots[@]}" -xdev -type f \
                -printf '%s\t%p\n' 2>/dev/null | sort -nr | head -30 || true
            fi

            echo '== Docker JSON logs (bytes, top 20) =='
            if [ -d /var/lib/docker/containers ]; then
              find /var/lib/docker/containers -xdev -type f -name '*-json.log' \
                -printf '%s\t%p\n' 2>/dev/null | sort -nr | head -20 || true
            else
              echo 'Docker container log directory unavailable'
            fi
          }

          report_tree() {
            local label="$1"
            local root="$2"
            local duration="$3"

            echo "== ${label} depth-two totals (bytes, top 100) =="
            if [ ! -d "$root" ]; then
              echo "directory unavailable: $root"
              return
            fi
            # shellcheck disable=SC2016
            timeout --kill-after=10s "$duration" bash -c '
              set -o pipefail
              du -x -B1 --max-depth=2 -- "$1" 2>/dev/null |
                sort -nr | head -100
            ' _ "$root" || true
          }

          report_deep() {
            local docker_root=''
            local docker_root_raw=''
            local root
            local -a large_file_roots=()

            if ! command -v timeout >/dev/null 2>&1; then
              echo 'timeout unavailable; skipping deep disk report'
              return
            fi

            echo '== Mount inventory =='
            if command -v findmnt >/dev/null 2>&1; then
              findmnt -rn -o TARGET,SOURCE,FSTYPE || true
            else
              echo 'findmnt unavailable'
            fi

            echo '== Docker detailed usage =='
            docker_root_raw="$(
              timeout --kill-after=10s 1m docker info \
                --format '{{.DockerRootDir}}' 2>/dev/null || true
            )"
            if [ -n "$docker_root_raw" ] && command -v realpath >/dev/null 2>&1; then
              docker_root="$(realpath -e -- "$docker_root_raw" 2>/dev/null || true)"
            fi
            printf 'Docker root: %s\n' "${docker_root:-unavailable}"
            timeout --kill-after=10s 2m docker system df -v || true
            timeout --kill-after=10s 1m docker ps -a --no-trunc --size \
              --format 'table {{.ID}}\t{{.Names}}\t{{.Status}}\t{{.Size}}' || true

            report_tree '/www' /www 5m
            report_tree '/var/log' /var/log 2m
            report_tree '/var/cache' /var/cache 1m

            case "$docker_root" in
              /*)
                if [ "$docker_root" != / ] && [ -d "$docker_root" ]; then
                  report_tree 'Docker root' "$docker_root" 4m
                else
                  echo 'Docker root is unavailable or unsafe to scan'
                fi
                ;;
              *) echo 'Docker root is unavailable or not absolute' ;;
            esac

            for root in /www /var/log; do
              [ ! -d "$root" ] || large_file_roots+=("$root")
            done
            if [ -n "$docker_root" ] && [ "$docker_root" != / ] && \
              [ -d "$docker_root/containers" ]; then
              large_file_roots+=("$docker_root/containers")
            fi

            echo '== Files over 100 MB (bytes, top 50) =='
            if [ "${#large_file_roots[@]}" -eq 0 ]; then
              echo 'no approved large-file roots available'
            else
              # shellcheck disable=SC2016
              timeout --kill-after=10s 5m bash -c '
                set -o pipefail
                find "$@" -xdev -type f -size +100M \
                  -printf "%s\t%p\n" 2>/dev/null | sort -nr | head -50
              ' _ "${large_file_roots[@]}" || true
            fi
          }

          cleanup_safe() {
            echo '== Safe cleanup =='
            docker container prune -f --filter 'until=168h'
            docker network prune -f --filter 'until=168h'
            docker image prune -af
            docker builder prune -af

            if command -v apt-get >/dev/null 2>&1; then
              apt-get clean
            elif command -v dnf >/dev/null 2>&1; then
              dnf clean all
            elif command -v yum >/dev/null 2>&1; then
              yum clean all
            else
              echo 'package manager cache cleanup unavailable'
            fi

            if command -v journalctl >/dev/null 2>&1; then
              journalctl --vacuum-time=14d
              journalctl --vacuum-size=512M
            fi
          }

          echo '### Before maintenance'
          report_disk

          if [ "$action" = cleanup-safe ]; then
            cleanup_safe
            sync
            echo '### After maintenance'
            report_disk
          else
            if [ "$action" = report-deep ]; then
              echo '### Deep disk report'
              report_deep
            fi
            echo '### After maintenance'
            echo 'report-only action; no cleanup performed'
          fi
          REMOTE_MAINTENANCE
