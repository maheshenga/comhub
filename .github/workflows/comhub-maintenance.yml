name: ComHub Server Maintenance
run-name: ComHub Server Maintenance (action=${{ inputs.action }})

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Read-only reports or bounded safe cleanup'
        required: true
        default: report
        type: choice
        options:
          - report
          - report-deep
          - report-blue-release-caches
          - cleanup-safe
          - cleanup-blue-release-caches

permissions:
  contents: read

jobs:
  maintenance:
    name: Server Disk Maintenance
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: comhub-production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout maintenance tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate maintenance request
        shell: bash
        env:
          MAINTENANCE_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" = 'refs/heads/main' ]] || {
            echo 'production maintenance must be dispatched from main' >&2
            exit 1
          }
          case "$MAINTENANCE_ACTION" in
            report|report-deep|report-blue-release-caches|cleanup-safe|cleanup-blue-release-caches) ;;
            *)
              echo 'unsupported maintenance action' >&2
              exit 1
              ;;
          esac

      - name: Install SSH key
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.COMHUB_SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.COMHUB_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          grep -q '[^[:space:]]' <<< "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/comhub_maintenance_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/comhub_maintenance_key
          chmod 600 ~/.ssh/known_hosts

      - name: Run bounded server maintenance
        shell: bash
        env:
          MAINTENANCE_ACTION: ${{ inputs.action }}
          SSH_HOST: ${{ secrets.COMHUB_SSH_HOST }}
          SSH_PORT: ${{ secrets.COMHUB_SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.COMHUB_SSH_USER || 'root' }}
        run: |
          set -euo pipefail

          case "$MAINTENANCE_ACTION" in
            report|report-deep|report-blue-release-caches|cleanup-safe|cleanup-blue-release-caches) ;;
            *)
              echo 'unsupported maintenance action' >&2
              exit 1
              ;;
          esac

          ssh_options=(
            -i "$HOME/.ssh/comhub_maintenance_key"
            -p "$SSH_PORT"
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$HOME/.ssh/known_hosts"
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=4
            -o ConnectTimeout=30
          )

          # The action is restricted to the fixed choice list above.
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$MAINTENANCE_ACTION'" <<'REMOTE_MAINTENANCE'
          set -Eeuo pipefail
          export LC_ALL=C

          action="$1"
          case "$action" in
            report|report-deep|report-blue-release-caches|cleanup-safe|cleanup-blue-release-caches) ;;
            *)
              echo 'unsupported remote maintenance action' >&2
              exit 1
              ;;
          esac

          report_disk() {
            local target
            local -a largest_file_roots=()

            echo '== Root filesystem =='
            df -hT /
            df -B1 /
            df -i /

            echo '== Docker summary =='
            docker system df || true
            docker ps -a --size \
              --format 'table {{.Names}}\t{{.Status}}\t{{.Size}}' || true

            echo '== System journal =='
            if command -v journalctl >/dev/null 2>&1; then
              journalctl --disk-usage || true
            else
              echo 'journalctl unavailable'
            fi

            echo '== Selected directory totals (bytes) =='
            {
              for target in \
                /var/lib/docker \
                /var/log \
                /var/cache \
                /www \
                /www/compose/comhub \
                /www/wwwlogs \
                /tmp; do
                if [ -e "$target" ]; then
                  du -x -s -B1 -- "$target" 2>/dev/null || true
                fi
              done
            } | sort -nr | head -20 || true

            for target in /www/compose/comhub /www/wwwlogs /var/log; do
              [ ! -d "$target" ] || largest_file_roots+=("$target")
            done
            echo '== Largest selected files (bytes, top 30) =='
            if [ "${#largest_file_roots[@]}" -eq 0 ]; then
              echo 'no selected file roots available'
            else
              find "${largest_file_roots[@]}" -xdev -type f \
                -printf '%s\t%p\n' 2>/dev/null | sort -nr | head -30 || true
            fi

            echo '== Docker JSON logs (bytes, top 20) =='
            if [ -d /var/lib/docker/containers ]; then
              find /var/lib/docker/containers -xdev -type f -name '*-json.log' \
                -printf '%s\t%p\n' 2>/dev/null | sort -nr | head -20 || true
            else
              echo 'Docker container log directory unavailable'
            fi
          }

          report_tree() {
            local label="$1"
            local root="$2"
            local duration="$3"

            echo "== ${label} depth-two totals (bytes, top 100) =="
            if [ ! -d "$root" ]; then
              echo "directory unavailable: $root"
              return
            fi
            # shellcheck disable=SC2016
            timeout --kill-after=10s "$duration" bash -c '
              set -o pipefail
              du -x -B1 --max-depth=2 -- "$1" 2>/dev/null |
                sort -nr | head -100
            ' _ "$root" || true
          }

          report_deep() {
            local docker_root=''
            local docker_root_raw=''
            local root
            local -a large_file_roots=()

            if ! command -v timeout >/dev/null 2>&1; then
              echo 'timeout unavailable; skipping deep disk report'
              return
            fi

            echo '== Mount inventory =='
            if command -v findmnt >/dev/null 2>&1; then
              findmnt -rn -o TARGET,SOURCE,FSTYPE || true
            else
              echo 'findmnt unavailable'
            fi

            echo '== Docker detailed usage =='
            docker_root_raw="$(
              timeout --kill-after=10s 1m docker info \
                --format '{{.DockerRootDir}}' 2>/dev/null || true
            )"
            if [ -n "$docker_root_raw" ] && command -v realpath >/dev/null 2>&1; then
              docker_root="$(realpath -e -- "$docker_root_raw" 2>/dev/null || true)"
            fi
            printf 'Docker root: %s\n' "${docker_root:-unavailable}"
            timeout --kill-after=10s 2m docker system df -v || true
            timeout --kill-after=10s 1m docker ps -a --no-trunc --size \
              --format 'table {{.ID}}\t{{.Names}}\t{{.Status}}\t{{.Size}}' || true

            report_tree '/www' /www 5m
            report_tree '/var/log' /var/log 2m
            report_tree '/var/cache' /var/cache 1m

            case "$docker_root" in
              /*)
                if [ "$docker_root" != / ] && [ -d "$docker_root" ]; then
                  report_tree 'Docker root' "$docker_root" 4m
                else
                  echo 'Docker root is unavailable or unsafe to scan'
                fi
                ;;
              *) echo 'Docker root is unavailable or not absolute' ;;
            esac

            for root in /www /var/log; do
              [ ! -d "$root" ] || large_file_roots+=("$root")
            done
            if [ -n "$docker_root" ] && [ "$docker_root" != / ] && \
              [ -d "$docker_root/containers" ]; then
              large_file_roots+=("$docker_root/containers")
            fi

            echo '== Files over 100 MB (bytes, top 50) =='
            if [ "${#large_file_roots[@]}" -eq 0 ]; then
              echo 'no approved large-file roots available'
            else
              # shellcheck disable=SC2016
              timeout --kill-after=10s 5m bash -c '
                set -o pipefail
                find "$@" -xdev -type f -size +100M \
                  -printf "%s\t%p\n" 2>/dev/null | sort -nr | head -50
              ' _ "${large_file_roots[@]}" || true
            fi
          }

          cleanup_safe() {
            echo '== Safe cleanup =='
            docker container prune -f --filter 'until=168h'
            docker network prune -f --filter 'until=168h'
            docker image prune -af
            docker builder prune -af

            if command -v apt-get >/dev/null 2>&1; then
              apt-get clean
            elif command -v dnf >/dev/null 2>&1; then
              dnf clean all
            elif command -v yum >/dev/null 2>&1; then
              yum clean all
            else
              echo 'package manager cache cleanup unavailable'
            fi

            if command -v journalctl >/dev/null 2>&1; then
              journalctl --vacuum-time=14d
              journalctl --vacuum-size=512M
            fi
          }

          blue_release_cache_maintenance() {
            local mode="$1"
            local fixed_releases_root='/www/wwwroot/blue/releases'
            local fixed_current_link='/www/wwwroot/blue/current'
            local releases_root=''
            local releases_root_now=''
            local current_target=''
            local current_target_now=''
            local release_path=''
            local release_canonical=''
            local next_path=''
            local next_canonical=''
            local cache_path=''
            local cache_canonical=''
            local du_output=''
            local cache_size=''
            local find_pid=''
            local required_command=''
            local index=0
            local total_bytes=0
            local -a old_release_paths=()
            local -a cache_paths=()
            local -a cache_sizes=()

            case "$mode" in
              report|cleanup) ;;
              *)
                echo 'unsupported blue release cache mode' >&2
                return 1
                ;;
            esac

            for required_command in realpath find du; do
              command -v "$required_command" >/dev/null 2>&1 || {
                echo "required command unavailable: $required_command" >&2
                return 1
              }
            done
            if [ "$mode" = cleanup ]; then
              command -v rm >/dev/null 2>&1 || {
                echo 'required command unavailable: rm' >&2
                return 1
              }
            fi

            [ -d "$fixed_releases_root" ] || {
              echo "blue releases root unavailable: $fixed_releases_root" >&2
              return 1
            }
            [ ! -L "$fixed_releases_root" ] || {
              echo 'blue releases root must not be a symlink' >&2
              return 1
            }
            releases_root="$(realpath -e -- "$fixed_releases_root")" || {
              echo 'failed to canonicalize blue releases root' >&2
              return 1
            }
            [ "$releases_root" = "$fixed_releases_root" ] || {
              echo 'blue releases root canonical path mismatch' >&2
              return 1
            }

            [ -L "$fixed_current_link" ] || {
              echo "blue current link unavailable: $fixed_current_link" >&2
              return 1
            }
            current_target="$(realpath -e -- "$fixed_current_link")" || {
              echo 'failed to resolve blue current release' >&2
              return 1
            }
            [ -d "$current_target" ] && [ "${current_target%/*}" = "$releases_root" ] || {
              echo 'blue current release must be an immediate child of releases root' >&2
              return 1
            }

            mapfile -d '' -t old_release_paths < <(
              find "$releases_root" \
                -mindepth 1 -maxdepth 1 -type d -mmin +10080 -print0
            )
            find_pid="$!"
            if ! wait "$find_pid"; then
              echo 'failed to enumerate old blue releases' >&2
              return 1
            fi

            echo '== Blue release cache inventory =='
            printf 'releases_root=%q\n' "$releases_root"
            printf 'current_release=%q\n' "$current_target"
            printf 'age_filter=%s\n' 'release directory mtime older than 7 days'

            for release_path in "${old_release_paths[@]}"; do
              [ ! -L "$release_path" ] || {
                echo 'old release candidate must not be a symlink' >&2
                return 1
              }
              release_canonical="$(realpath -e -- "$release_path")" || {
                echo 'failed to canonicalize old release candidate' >&2
                return 1
              }
              [ "$release_canonical" = "$release_path" ] && \
                [ "${release_canonical%/*}" = "$releases_root" ] || {
                echo 'old release candidate escaped releases root' >&2
                return 1
              }
              [ "$release_canonical" != "$current_target" ] || continue

              next_path="$release_canonical/.next"
              cache_path="$next_path/cache"
              if [ ! -e "$cache_path" ] && [ ! -L "$cache_path" ]; then
                continue
              fi
              [ -d "$next_path" ] && [ ! -L "$next_path" ] || {
                echo 'candidate .next path must be a real directory' >&2
                return 1
              }
              [ -d "$cache_path" ] && [ ! -L "$cache_path" ] || {
                echo 'candidate cache path must be a real directory' >&2
                return 1
              }
              next_canonical="$(realpath -e -- "$next_path")" || {
                echo 'failed to canonicalize candidate .next path' >&2
                return 1
              }
              cache_canonical="$(realpath -e -- "$cache_path")" || {
                echo 'failed to canonicalize candidate cache path' >&2
                return 1
              }
              [ "$next_canonical" = "$next_path" ] && \
                [ "${next_canonical%/*}" = "$release_canonical" ] && \
                [ "$cache_canonical" = "$cache_path" ] && \
                [ "${cache_canonical%/*}" = "$next_canonical" ] || {
                echo 'candidate cache canonical path mismatch' >&2
                return 1
              }

              if ! du_output="$(du -x -s -B1 -- "$cache_path")"; then
                echo 'failed to measure candidate cache' >&2
                return 1
              fi
              cache_size="${du_output%%[[:space:]]*}"
              case "$cache_size" in
                ''|*[!0-9]*)
                  echo 'candidate cache size was not numeric' >&2
                  return 1
                  ;;
              esac
              cache_paths+=("$cache_path")
              cache_sizes+=("$cache_size")
              total_bytes=$((total_bytes + cache_size))
              printf 'candidate_cache=%q bytes=%s\n' "$cache_path" "$cache_size"
            done

            printf 'candidate_count=%s\n' "${#cache_paths[@]}"
            printf 'candidate_cache_bytes=%s\n' "$total_bytes"
            [ "$mode" = cleanup ] || return 0

            current_target_now="$(realpath -e -- "$fixed_current_link")" || {
              echo 'failed to re-resolve blue current release' >&2
              return 1
            }
            [ "$current_target_now" = "$current_target" ] || {
              echo 'blue current release changed during inventory; refusing cleanup' >&2
              return 1
            }

            for index in "${!cache_paths[@]}"; do
              cache_path="${cache_paths[$index]}"
              release_path="${cache_path%/.next/cache}"
              next_path="$release_path/.next"
              [ "$release_path" != "$current_target_now" ] && \
                [ ! -L "$release_path" ] && \
                [ ! -L "$next_path" ] && \
                [ -d "$cache_path" ] && [ ! -L "$cache_path" ] || {
                echo 'candidate cache changed before cleanup; refusing cleanup' >&2
                return 1
              }
              release_canonical="$(realpath -e -- "$release_path")" || return 1
              next_canonical="$(realpath -e -- "$next_path")" || return 1
              cache_canonical="$(realpath -e -- "$cache_path")" || return 1
              [ "$release_canonical" = "$release_path" ] && \
                [ "${release_canonical%/*}" = "$releases_root" ] && \
                [ "$next_canonical" = "$next_path" ] && \
                [ "${next_canonical%/*}" = "$release_canonical" ] && \
                [ "$cache_canonical" = "$cache_path" ] && \
                [ "${cache_canonical%/*}" = "$next_canonical" ] || {
                echo 'candidate cache failed final canonical path validation' >&2
                return 1
              }
            done

            for index in "${!cache_paths[@]}"; do
              cache_path="${cache_paths[$index]}"
              release_path="${cache_path%/.next/cache}"
              next_path="$release_path/.next"

              [ ! -L "$fixed_releases_root" ] && [ -L "$fixed_current_link" ] || {
                echo 'blue release roots changed before deletion; refusing cleanup' >&2
                return 1
              }
              releases_root_now="$(realpath -e -- "$fixed_releases_root")" || return 1
              current_target_now="$(realpath -e -- "$fixed_current_link")" || return 1
              [ "$releases_root_now" = "$releases_root" ] && \
                [ "$current_target_now" = "$current_target" ] && \
                [ "$release_path" != "$current_target_now" ] && \
                [ ! -L "$release_path" ] && \
                [ ! -L "$next_path" ] && \
                [ -d "$cache_path" ] && [ ! -L "$cache_path" ] || {
                echo 'blue release paths changed before deletion; refusing cleanup' >&2
                return 1
              }
              release_canonical="$(realpath -e -- "$release_path")" || return 1
              next_canonical="$(realpath -e -- "$next_path")" || return 1
              cache_canonical="$(realpath -e -- "$cache_path")" || return 1
              [ "$release_canonical" = "$release_path" ] && \
                [ "${release_canonical%/*}" = "$releases_root" ] && \
                [ "$next_canonical" = "$next_path" ] && \
                [ "${next_canonical%/*}" = "$release_canonical" ] && \
                [ "$cache_canonical" = "$cache_path" ] && \
                [ "${cache_canonical%/*}" = "$next_canonical" ] || {
                echo 'candidate cache failed deletion-time path validation' >&2
                return 1
              }

              rm -rf --one-file-system -- "$cache_path"
              if [ -e "$cache_path" ] || [ -L "$cache_path" ]; then
                echo 'candidate cache still exists after cleanup' >&2
                return 1
              fi
              printf 'deleted_cache=%q bytes=%s\n' "$cache_path" "${cache_sizes[$index]}"
            done
            printf 'deleted_cache_count=%s\n' "${#cache_paths[@]}"
            printf 'deleted_cache_bytes=%s\n' "$total_bytes"
          }

          echo '### Before maintenance'
          report_disk

          case "$action" in
            cleanup-safe)
              cleanup_safe
              sync
              echo '### After maintenance'
              report_disk
              ;;
            cleanup-blue-release-caches)
              blue_release_cache_maintenance cleanup
              sync
              echo '### After maintenance'
              report_disk
              ;;
            report-blue-release-caches)
              blue_release_cache_maintenance report
              echo '### After maintenance'
              echo 'report-only action; no cleanup performed'
              ;;
            report-deep)
              echo '### Deep disk report'
              report_deep
              echo '### After maintenance'
              echo 'report-only action; no cleanup performed'
              ;;
            report)
              echo '### After maintenance'
              echo 'report-only action; no cleanup performed'
              ;;
          esac
          REMOTE_MAINTENANCE
