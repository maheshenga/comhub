name: ComHub PR Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: comhub-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify deployment workflow contracts
        run: node --test .github/workflows/comhubDeploymentWorkflows.test.mjs

      # The upstream baseline tag must exist for the customization gate; fetch
      # the exact tag shallowly to avoid pulling full upstream history.
      - name: Fetch upstream baseline tag
        run: |
          git remote add upstream https://github.com/lobehub/lobehub.git || true
          git fetch --depth=1 upstream tag v2.2.18 --no-tags || \
            echo "::warning::could not fetch upstream v2.2.18; gate will fail with a fetch hint"

      - name: Verify customization registry
        run: node --test scripts/comhub-customizations/registry.test.mjs && node scripts/comhub-customizations/verify.mjs

      - name: Verify database migration chain
        run: pnpm verify:database-migrations

      # The Admin suite is collected only by the root `app` project; the
      # business-server suite lives behind its own vitest.config.mts, so the
      # root projects collect 0 files from packages/** (see blueprint §7.3-2).
      - name: Run Admin feature tests
        run: npx vitest run --project app src/features/Admin

      - name: Run business-server admin tests
        working-directory: packages/business-server
        run: npx vitest run src/lambda-routers/admin src/appSettings

      # tsgo peaks past the 7 GB hosted runner's RAM and the kernel reaps it
      # (job dies with a shutdown signal ~2.5 min into `tsgo --noEmit`). A
      # swap file absorbs the peak; this step is cheap when there is headroom.
      - name: Add swap for the native type checker
        run: |
          if [ "$(free -m | awk '/^Swap:/{print $2}')" -lt 4096 ]; then
            sudo swapoff -a || true
            sudo fallocate -l 6G /mnt/swapfile
            sudo chmod 600 /mnt/swapfile
            sudo mkswap /mnt/swapfile
            sudo swapon /mnt/swapfile
            free -m
          fi

      - name: Type check
        run: pnpm type-check
