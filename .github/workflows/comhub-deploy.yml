name: ComHub Deploy Production
run-name: ComHub Deploy Production (source=${{ inputs.source_sha || github.sha }}, full=${{ inputs.verify_module_app_full }})

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Optional full commit SHA from main; defaults to the selected workflow ref SHA'
        required: false
        type: string
      verify_module_app_full:
        description: 'Require credentialed Alipay and authenticated staging probes before deploy'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read
  packages: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  NODEJS_VERSION: '22'

jobs:
  resolve-source:
    name: Resolve Deployment Source
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.source.outputs.image_tag }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Checkout main history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Validate source commit
        id: source
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail

          [[ "$GITHUB_REF" = 'refs/heads/main' ]] || {
            echo 'production deployment workflows must be dispatched from main' >&2
            exit 1
          }

          source_sha="${REQUESTED_SOURCE_SHA:-$GITHUB_SHA}"
          source_sha="${source_sha,,}"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'source_sha must be a full 40-character commit SHA' >&2
            exit 1
          }

          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git cat-file -e "${source_sha}^{commit}"
          git merge-base --is-ancestor "$source_sha" origin/main || {
            echo 'source_sha must belong to origin/main history' >&2
            exit 1
          }

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${source_sha:0:12}" >> "$GITHUB_OUTPUT"

  verify-module-app-full:
    name: Verify Module App Credentialed Probes
    needs: [resolve-source]
    runs-on: ubuntu-latest
    if: ${{ inputs.verify_module_app_full == 'true' }}
    environment: module-app-staging
    env:
      MODULE_APP_ALIPAY_APP_ID: ${{ secrets.MODULE_APP_ALIPAY_APP_ID }}
      MODULE_APP_ALIPAY_APP_CERT_SN: ${{ vars.MODULE_APP_ALIPAY_APP_CERT_SN }}
      MODULE_APP_ALIPAY_CERTIFICATE: ${{ secrets.MODULE_APP_ALIPAY_CERTIFICATE }}
      MODULE_APP_ALIPAY_CERT_MODE: ${{ vars.MODULE_APP_ALIPAY_CERT_MODE || 'public_key' }}
      MODULE_APP_ALIPAY_MERCHANT_PRIVATE_KEY: ${{ secrets.MODULE_APP_ALIPAY_MERCHANT_PRIVATE_KEY }}
      MODULE_APP_ALIPAY_NOTIFY_URL: ${{ vars.MODULE_APP_ALIPAY_NOTIFY_URL }}
      MODULE_APP_ALIPAY_PUBLIC_KEY: ${{ secrets.MODULE_APP_ALIPAY_PUBLIC_KEY }}
      MODULE_APP_ALIPAY_RETURN_URL: ${{ vars.MODULE_APP_ALIPAY_RETURN_URL }}
      MODULE_APP_ALIPAY_ROOT_CERT_SN: ${{ vars.MODULE_APP_ALIPAY_ROOT_CERT_SN }}
      MODULE_APP_ALIPAY_SELLER_ID: ${{ secrets.MODULE_APP_ALIPAY_SELLER_ID }}
      MODULE_APP_E2E_APP_ID: ${{ vars.MODULE_APP_E2E_APP_ID }}
      MODULE_APP_E2E_BASE_URL: ${{ vars.MODULE_APP_E2E_BASE_URL }}
      MODULE_APP_E2E_DENIED_WORKSPACE_ID: ${{ vars.MODULE_APP_E2E_DENIED_WORKSPACE_ID }}
      MODULE_APP_E2E_PAID_APP_ID: ${{ vars.MODULE_APP_E2E_PAID_APP_ID }}
      MODULE_APP_E2E_PENDING_APP_ID: ${{ vars.MODULE_APP_E2E_PENDING_APP_ID }}
      MODULE_APP_E2E_REFUNDED_APP_ID: ${{ vars.MODULE_APP_E2E_REFUNDED_APP_ID }}
      MODULE_APP_E2E_REVOKED_APP_ID: ${{ vars.MODULE_APP_E2E_REVOKED_APP_ID }}
      MODULE_APP_E2E_RUN_ID: ${{ vars.MODULE_APP_E2E_RUN_ID }}
      MODULE_APP_E2E_TEAM_WORKSPACE_ID: ${{ vars.MODULE_APP_E2E_TEAM_WORKSPACE_ID }}
    steps:
      - name: Checkout deployment source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODEJS_VERSION }}

      - name: Install dependencies and browser
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter @lobechat/e2e-tests exec playwright install --with-deps chromium

      - name: Run credentialed Alipay and authenticated browser probes
        run: pnpm verify:module-app-production:full

  resolve-images:
    name: Resolve Existing Image Digests
    needs: [resolve-source]
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.images.outputs.image_ref }}
      runtime_image_ref: ${{ steps.images.outputs.runtime_image_ref }}
    steps:
      - name: Checkout deployment tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.COMHUB_GHCR_USERNAME || github.repository_owner }}
          password: ${{ secrets.COMHUB_GHCR_TOKEN || github.token }}

      - name: Resolve immutable image references
        id: images
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.resolve-source.outputs.image_tag }}
        run: |
          set -euo pipefail

          image_ref="$(node .github/scripts/resolveImageReference.mjs "${IMAGE_NAME}:${IMAGE_TAG}")"
          runtime_image_ref="$(node .github/scripts/resolveImageReference.mjs "${IMAGE_NAME}-module-runtime:${IMAGE_TAG}")"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "runtime_image_ref=$runtime_image_ref" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy Production
    needs: [resolve-source, resolve-images, verify-module-app-full]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.resolve-source.result == 'success' && needs.resolve-images.result == 'success' && (needs.verify-module-app-full.result == 'success' || needs.verify-module-app-full.result == 'skipped') }}
    timeout-minutes: 45
    environment: production
    concurrency:
      group: comhub-production-deploy
      cancel-in-progress: false
    steps:
      - name: Install SSH key
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.COMHUB_SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.COMHUB_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          grep -q '[^[:space:]]' <<< "$SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/comhub_deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/comhub_deploy_key
          chmod 600 ~/.ssh/known_hosts

      - name: Run remote blue-green deploy
        shell: bash
        env:
          SSH_HOST: ${{ secrets.COMHUB_SSH_HOST }}
          SSH_PORT: ${{ secrets.COMHUB_SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.COMHUB_SSH_USER || 'root' }}
          DEPLOY_DIR: ${{ vars.COMHUB_DEPLOY_DIR || '/www/compose/comhub' }}
          IMAGE_REF: ${{ needs.resolve-images.outputs.image_ref }}
          IMAGE_TAG: ${{ needs.resolve-source.outputs.image_tag }}
          REQUIRE_MODULE_RUNTIME: ${{ inputs.verify_module_app_full == 'true' }}
          RUNTIME_IMAGE_REF: ${{ needs.resolve-images.outputs.runtime_image_ref }}
        run: |
          set -euo pipefail

          ssh_options=(
            -i "$HOME/.ssh/comhub_deploy_key"
            -p "$SSH_PORT"
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$HOME/.ssh/known_hosts"
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=6
            -o ConnectTimeout=30
          )

          timeout "${COMHUB_REMOTE_DEPLOY_TIMEOUT:-2400}" \
            ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" \
            "DEPLOY_DIR='$DEPLOY_DIR' IMAGE_REF='$IMAGE_REF' IMAGE_TAG='$IMAGE_TAG' REQUIRE_MODULE_RUNTIME='$REQUIRE_MODULE_RUNTIME' RUNTIME_IMAGE_REF='$RUNTIME_IMAGE_REF' bash -s" <<'REMOTE_DEPLOY'
          set -euo pipefail

          cd "$DEPLOY_DIR"
          export COMHUB_MODULE_RUNTIME_IMAGE="$RUNTIME_IMAGE_REF"

          verify_module_runtime() {
            local runtime_id
            runtime_id="$(docker compose ps -q module-runtime)"
            test -n "${runtime_id}"
            test "$(docker inspect -f '{{.Config.Image}}' "${runtime_id}")" = "$RUNTIME_IMAGE_REF"
            test "$(docker inspect -f '{{.Config.User}}' "${runtime_id}")" = "10001:10001"
            test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "${runtime_id}")" = "true"
            docker inspect -f '{{json .HostConfig.SecurityOpt}}' "${runtime_id}" | grep -q no-new-privileges
            docker inspect -f '{{range .Mounts}}{{if eq .Destination "/runtime/artifacts"}}{{.RW}}{{end}}{{end}}' "${runtime_id}" | grep -qx false
            docker compose exec -T module-runtime node -e "const http=require('http');http.get('http://127.0.0.1:3210/health',response=>process.exit(response.statusCode===200?0:1)).on('error',()=>process.exit(1))"
            docker compose exec -T module-runtime node -e "const http=require('http');const request=http.request({host:'127.0.0.1',port:3210,path:'/v1/invocations',method:'POST'},response=>process.exit(response.statusCode===503?0:1));request.end('{}')"
          }

          verify_runtime_auth_boundary() {
            local probe_name="module-runtime-auth-probe-${IMAGE_TAG}"
            docker rm -f "$probe_name" >/dev/null 2>&1 || true
            docker run -d --name "$probe_name" --read-only --tmpfs /tmp:size=16m \
              -e MODULE_APP_EXECUTION_ENABLED=true \
              -e MODULE_APP_RUNTIME_INVOCATION_ENABLED=true \
              -e MODULE_APP_RUNTIME_INTERNAL_TOKEN=deployment-auth-probe \
              -e 'MODULE_APP_RUNTIME_JWKS={"keys":[]}' \
              -e MODULE_APP_RUNTIME_NODE22_IMAGE=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
              -e MODULE_APP_RUNTIME_PYTHON312_IMAGE=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
              "$RUNTIME_IMAGE_REF" >/dev/null
            for attempt in $(seq 1 30); do
              probe_status="$(docker inspect -f '{{.State.Health.Status}}' "$probe_name")"
              [ "$probe_status" = "healthy" ] && break
              [ "$probe_status" = "unhealthy" ] && break
              sleep 1
            done
            if [ "${probe_status:-missing}" != "healthy" ]; then
              docker logs "$probe_name" || true
              docker rm -f "$probe_name" >/dev/null 2>&1 || true
              return 1
            fi
            if ! docker exec "$probe_name" node -e "const http=require('http');const request=http.request({host:'127.0.0.1',port:3210,path:'/v1/invocations',method:'POST'},response=>process.exit(response.statusCode===401?0:1));request.end('{}')"; then
              docker logs "$probe_name" || true
              docker rm -f "$probe_name" >/dev/null 2>&1 || true
              return 1
            fi
            docker rm -f "$probe_name" >/dev/null
          }

          echo "Disk usage before deploy:"
          df -h /
          docker system df || true

          echo "Pruning unused Docker images before pull to protect Redis persistence space..."
          docker image prune -af || true

          if command -v ctr >/dev/null 2>&1; then
            echo "Pre-pulling image through containerd: $IMAGE_REF"
            timeout "${COMHUB_CTR_PULL_TIMEOUT:-1800}" \
              ctr -n moby images pull --platform linux/amd64 "$IMAGE_REF"
          else
            echo "containerd ctr not found; falling back to deploy.sh docker compose pull"
          fi

          module_runtime_configured=false
          if docker compose config --services | grep -qx module-runtime; then
            module_runtime_configured=true
          fi

          if [ "$REQUIRE_MODULE_RUNTIME" = "true" ] && [ "$module_runtime_configured" != "true" ]; then
            echo "Credentialed deployment requires a configured module-runtime service before traffic switching"
            exit 1
          fi

          if [ "$module_runtime_configured" = "true" ]; then
            docker pull "$RUNTIME_IMAGE_REF"
            docker compose up -d --no-deps --wait module-runtime
            verify_module_runtime
          fi

          if [ "$REQUIRE_MODULE_RUNTIME" = "true" ]; then
            verify_runtime_auth_boundary
          fi

          COMHUB_IMAGE="$IMAGE_REF" COMHUB_IMAGE_TAG="$IMAGE_TAG" ./deploy.sh "$IMAGE_REF"

          echo "Running post-deploy runtime smoke checks..."
          for path in / /api/auth/get-session /api/version; do
            code="$(curl -sS -o /tmp/comhub-smoke.out -w '%{http_code}' "http://127.0.0.1:${COMHUB_PORT:-3213}${path}")"
            echo "Smoke ${path}: HTTP ${code}"
            if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then
              echo "Smoke check failed for ${path}; response preview:"
              head -c 500 /tmp/comhub-smoke.out || true
              exit 1
            fi
          done

          version_json="$(curl -fsS "http://127.0.0.1:${COMHUB_PORT:-3213}/api/version")"
          echo "Version evidence: ${version_json}"
          echo "${version_json}" | grep -q "${IMAGE_TAG}"

          for flag in \
            MODULE_APP_EXECUTION_ENABLED \
            MODULE_APP_RUNTIME_INVOCATION_ENABLED \
            MODULE_APP_WORKFLOW_PRIVILEGED_EXECUTORS_ENABLED \
            MODULE_APP_SCHEDULE_DISPATCH_ENABLED \
            MODULE_APP_ALIPAY_PAYMENT_CREATION_ENABLED \
            MODULE_APP_ALIPAY_AUTO_SETTLEMENT_ENABLED \
            MODULE_APP_PUBLISHER_PAYOUT_RECORDING_ENABLED; do
            value="$(docker compose exec -T lobe printenv "$flag" 2>/dev/null || true)"
            if [ "${value}" = "true" ]; then
              echo "Production control ${flag} must remain disabled until full gate evidence exists"
              exit 1
            fi
          done

          public_execution="$(docker compose exec -T lobe printenv MODULE_APP_PUBLIC_EXECUTION_ENABLED 2>/dev/null || true)"
          if [ "$public_execution" = "true" ]; then
            runtime_origin="$(docker compose exec -T lobe printenv MODULE_APP_RUNTIME_PUBLIC_ORIGIN 2>/dev/null || true)"
            runtime_allowlist="$(docker compose exec -T lobe printenv MODULE_APP_RUNTIME_APP_ALLOWLIST 2>/dev/null || true)"
            if [ "$module_runtime_configured" != "true" ]; then
              echo "Public Module App launch requires the module-runtime service"
              exit 1
            fi
            case "$runtime_origin" in
              https://*) ;;
              *)
                echo "Public Module App launch requires an HTTPS runtime origin"
                exit 1
                ;;
            esac
            if [ -z "$(printf '%s' "$runtime_allowlist" | tr -d '[:space:],')" ]; then
              echo "Public Module App launch requires a non-empty app allowlist"
              exit 1
            fi
          fi

          if [ "$module_runtime_configured" = "true" ]; then
            verify_module_runtime
          else
            echo "module-runtime is not configured; production mutation flags remain disabled"
          fi

          echo "Pruning unused Docker images after deploy..."
          docker image prune -af || true

          echo "Disk usage after deploy:"
          df -h /
          docker system df || true
          REMOTE_DEPLOY
